name: Deploy

on:
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'mitch-ai-services' }}
  REGION: ${{ vars.GCP_REGION || 'europe-west2' }}
  SERVICE: ai-gateway
  IMAGE: gcr.io/${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID || 'mitch-ai-services' }}/ai-gateway

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Select target project
        run: gcloud config set project "$PROJECT_ID"

      - name: Configure Docker for Container Registry
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push image
        run: |
          docker build \
            --build-arg GIT_SHA=${{ github.sha }} \
            -t "$IMAGE:$GITHUB_SHA" -t "$IMAGE:latest" .
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"

      - name: Deploy, verify exact revision and promote
        env:
          GIT_SHA: ${{ github.sha }}
        run: bash scripts/deploy-canary.sh
